<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="673" viewBox="0 0 1100 673" role="img" aria-labelledby="t d"><title id="t">웨일 웹 입력: 키 도착과 문자 삽입은 다른 단계</title><desc id="d">실제 관측을 요약한 설명도 · 내부 원인 확정 아님</desc><rect width="1100" height="673" fill="#f6f4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif" fill="#19363a"><rect x="46" y="35" width="8" height="72" fill="#16736a"/><text x="74" y="68" font-size="32" font-weight="700">웨일 웹 입력: 키 도착과 문자 삽입은 다른 단계</text><text x="74" y="110" font-size="21">실제 관측을 요약한 설명도 · 내부 원인 확정 아님</text><line x1="46" x2="1054" y1="170" y2="170" stroke="#ced8db"/><text x="46" y="210" font-size="24" font-weight="700">아이패드 → Jump</text><text x="270" y="210" font-size="23">한글 조합 과정에서 Unicode 키와 Backspace 전달</text><line x1="46" x2="1054" y1="272" y2="272" stroke="#ced8db"/><text x="46" y="312" font-size="24" font-weight="700">웨일 keydown</text><text x="270" y="312" font-size="23">한글 key 도착 / code=&quot;&quot; / keyCode=0</text><line x1="46" x2="1054" y1="374" y2="374" stroke="#ced8db"/><text x="46" y="414" font-size="24" font-weight="700">보정 전</text><text x="270" y="414" font-size="23">한글 삽입 누락 / Backspace 삭제는 처리</text><line x1="46" x2="1054" y1="476" y2="476" stroke="#ced8db"/><text x="46" y="516" font-size="24" font-weight="700">확장 보정 후</text><text x="270" y="516" font-size="23">해당 키만 insertText → 한글 입력 확인</text><text x="46" y="641" font-size="19" fill="#456065">네이티브 keycode 108 ≠ DOM keyCode 0 / 일반 IME·단축키·Backspace는 보정 제외</text></g></svg>