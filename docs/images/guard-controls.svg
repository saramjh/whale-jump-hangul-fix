<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="673" viewBox="0 0 1100 673" role="img" aria-labelledby="t d"><title id="t">ABC 자동 전환 앱: 네 가지 조작</title><desc id="d">설명용 사용법 도표 · 실제 화면 캡처가 아닙니다</desc><rect width="1100" height="673" fill="#f6f4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif" fill="#19363a"><rect x="46" y="35" width="8" height="72" fill="#16736a"/><text x="74" y="68" font-size="32" font-weight="700">ABC 자동 전환 앱: 네 가지 조작</text><text x="74" y="110" font-size="21">설명용 사용법 도표 · 실제 화면 캡처가 아닙니다</text><line x1="46" x2="1054" y1="170" y2="170" stroke="#ced8db"/><text x="46" y="210" font-size="24" font-weight="700">자동</text><text x="270" y="210" font-size="23">Jump 연결 → ABC 유지 / 마지막 연결 종료 → 이전 입력기</text><line x1="46" x2="1054" y1="272" y2="272" stroke="#ced8db"/><text x="46" y="312" font-size="24" font-weight="700">켜기</text><text x="270" y="312" font-size="23">접속 상태와 관계없이 ABC 유지</text><line x1="46" x2="1054" y1="374" y2="374" stroke="#ced8db"/><text x="46" y="414" font-size="24" font-weight="700">끄기</text><text x="270" y="414" font-size="23">ABC 고정 해제 + 입력기 복원 / 앱은 대기</text><line x1="46" x2="1054" y1="476" y2="476" stroke="#ced8db"/><text x="46" y="516" font-size="24" font-weight="700">프로그램 종료</text><text x="270" y="516" font-size="23">입력기 복원 + 앱 프로세스 종료</text><text x="46" y="641" font-size="19" fill="#456065">메뉴 막대 한 번 클릭: 수동 켜기·끄기 / 우클릭: 자동 모드·설정</text></g></svg>