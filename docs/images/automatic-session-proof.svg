<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="673" viewBox="0 0 1100 673" role="img" aria-labelledby="t d"><title id="t">실제 연결 테스트: 접속과 해제에 따라 입력기 복원</title><desc id="d">2026-10-13 · 사용자 원격 연결 + 앱 상태 관측</desc><rect width="1100" height="673" fill="#f6f4ef"/><g font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif" fill="#19363a"><rect x="46" y="35" width="8" height="72" fill="#16736a"/><text x="74" y="68" font-size="32" font-weight="700">실제 연결 테스트: 접속과 해제에 따라 입력기 복원</text><text x="74" y="110" font-size="21">2026-10-13 · 사용자 원격 연결 + 앱 상태 관측</text><line x1="46" x2="1054" y1="170" y2="170" stroke="#ced8db"/><text x="46" y="210" font-size="24" font-weight="700">대기 · 세션 0</text><text x="270" y="210" font-size="23">한글 두벌식 / ABC 고정 해제</text><line x1="46" x2="1054" y1="272" y2="272" stroke="#ced8db"/><text x="46" y="312" font-size="24" font-weight="700">연결 · 세션 1</text><text x="270" y="312" font-size="23">ABC로 전환 / 고정 켜짐</text><line x1="46" x2="1054" y1="374" y2="374" stroke="#ced8db"/><text x="46" y="414" font-size="24" font-weight="700">해제 · 세션 0</text><text x="270" y="414" font-size="23">한글 두벌식으로 복원</text><line x1="46" x2="1054" y1="476" y2="476" stroke="#ced8db"/><text x="46" y="516" font-size="24" font-weight="700">재접속 → 해제</text><text x="270" y="516" font-size="23">ABC → 한글 두벌식 / 같은 동작 재확인</text><text x="46" y="641" font-size="19" fill="#456065">연결 종료 뒤 앱은 메뉴 막대에서 대기합니다. 완전 종료는 별도 버튼으로 합니다.</text></g></svg>